name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      GROQ_API_KEY: test-dummy-key
      WHATSAPP_PHONE_NUMBER_ID: test-dummy-id
      WHATSAPP_ACCESS_TOKEN: test-dummy-token
      MONGODB_URI: mongodb://localhost:27017/test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test